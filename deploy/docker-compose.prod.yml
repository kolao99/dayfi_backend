# Production stack: Dayfi API + Caddy (TLS).
# Usage (from repo root):
#   cp .env deploy/.env   # production secrets — never commit
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SWITCH_NODE_ENV: production
      DAYFI_NODE_ENV: production
    restart: unless-stopped
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
